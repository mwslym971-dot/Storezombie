<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>متجري في خطر — V1.0</title>
<style>
:root{--gold:#ffcf5c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#060d1c;font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;color:#eaf2ff;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#top{position:fixed;top:0;right:0;left:0;display:flex;gap:5px;padding:6px 8px;align-items:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;background:linear-gradient(rgba(27,43,74,.9),rgba(13,23,46,.94));border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:2px 10px 2px 7px;font-weight:800;font-size:12.5px;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.chip img{width:17px;height:17px}
.chip b{color:var(--gold);min-width:26px;text-align:center}
.chip.gemv b{color:#7ff0e8}
.rs{display:inline-flex;align-items:center;gap:3px;margin-left:7px}
.rs img{width:15px;height:15px}
#lvl{background:linear-gradient(#5b3fd4,#37217c);border-radius:14px;padding:2px 10px;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:900;border:1px solid rgba(157,134,255,.4)}
#lvl img{width:16px;height:16px}
.xpw{width:60px;height:8px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
.xpw i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe27a,#ff9d2e)}
#waveChip.warn{background:linear-gradient(#8f1d1d,#5c1010);border-color:#ff6b6b;animation:pu 1s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
#mini{position:fixed;top:46px;left:6px;z-index:9;border:2px solid rgba(255,255,255,.2);border-radius:10px;background:#0a1424;pointer-events:none}
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:linear-gradient(rgba(26,44,85,.95),rgba(14,26,56,.95));border:1px solid rgba(255,217,92,.4);border-radius:22px;padding:6px 18px;font-weight:800;font-size:13px;animation:tin .3s;text-align:center;max-width:94%}
.toast.big{background:linear-gradient(#6a2f9e,#341a66);border-color:rgba(200,107,255,.65);font-size:15px;padding:9px 24px}
.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.red{border-color:#ff5c5c;color:#ff8f8f}
.toast.cop{border-color:#ff8ab0;background:linear-gradient(#4a2a5a,#2a1a3a);color:#ffd9e8}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
.ti{height:15px;vertical-align:-3px;margin:0 2px}
#nav{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:10}
.nbtn{width:62px;height:64px;border-radius:18px;background:linear-gradient(#3a5a94,#22365e 60%,#1a2a4c);border:1px solid rgba(109,155,224,.25);box-shadow:0 6px 0 #0d1930,0 8px 16px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit}
.nbtn img{width:26px;height:26px}
.nbtn span{font-size:10px;font-weight:900;color:#cfe0ff}
.nbtn:active{transform:translateY(4px)}
.ab{position:fixed;border-radius:50%;z-index:9;border:3px solid;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.ab img{filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#abtn{bottom:100px;right:18px;width:78px;height:78px;background:radial-gradient(circle at 32% 28%,#ffb066,#e2611e 55%,#a83a0e);border-color:rgba(255,217,168,.45);box-shadow:0 6px 0 #7a2a0c,0 10px 22px rgba(0,0,0,.65)}
#abtn img{width:38px;height:38px}
#ibtn{bottom:196px;right:26px;width:58px;height:58px;background:radial-gradient(circle at 32% 28%,#7fd0ff,#1f6fd6 55%,#0d3f8f);border-color:rgba(168,228,255,.45);box-shadow:0 5px 0 #0a2d66}
#ibtn img{width:26px;height:26px}
#pbtn{bottom:104px;right:112px;width:50px;height:50px;background:radial-gradient(circle at 32% 28%,#8fffb0,#12a54a 55%,#0a6b2e);border-color:rgba(192,255,208,.45);box-shadow:0 4px 0 #065022;display:none}
#pbtn img{width:22px;height:22px}
#pbtn b{position:absolute;top:-4px;left:-4px;background:#ffd95c;color:#3b2500;font-size:10px;border-radius:9px;padding:0 5px}
#rbtn{bottom:186px;right:110px;width:54px;height:54px;background:radial-gradient(circle at 32% 28%,#ffd95c,#ff9d2e 55%,#b06a12);border-color:rgba(255,230,160,.5);box-shadow:0 4px 0 #8a5508,0 8px 16px rgba(0,0,0,.6);display:none}
#rbtn img{width:28px;height:28px;animation:spin 8s linear infinite}
#rbtn b{position:absolute;top:-6px;right:-6px;background:#ff3b3b;color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;min-width:22px;text-align:center;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
#joy{position:fixed;bottom:96px;left:22px;width:122px;height:122px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.02) 55%,rgba(255,255,255,.09));border:2px solid rgba(255,255,255,.2);z-index:9;touch-action:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(159,180,216,.85) 65%,#5c7bb0);left:35px;top:35px;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(3,8,20,.72);z-index:50;display:none;align-items:center;justify-content:center}
#ov.on{display:flex}
.panel{width:min(720px,97vw);max-height:93vh;border-radius:24px;background:linear-gradient(165deg,#27406f,#152544 55%,#0f1c38);border:1px solid rgba(255,217,92,.25);display:flex;flex-direction:column;overflow:hidden;animation:pop .28s}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}}
.phead{padding:12px 16px;font-size:18px;font-weight:900;display:flex;gap:10px;align-items:center;background:linear-gradient(rgba(255,255,255,.09),rgba(255,255,255,.02));border-bottom:1px solid rgba(255,255,255,.1)}
.phead img{width:26px;height:26px}
#pclose{margin-right:auto;background:linear-gradient(#ff6b6b,#c0392b);border-radius:10px;width:34px;height:34px;color:#fff;border:none;font-weight:900;cursor:pointer}
.pbody{padding:14px;flex:1;overflow-y:auto;font-size:13px}
.pbody::-webkit-scrollbar{width:6px}.pbody::-webkit-scrollbar-thumb{background:linear-gradient(#ffcf5c,#ff9d2e);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.card{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:8px 6px;text-align:center}
.card img.iico{width:46px;height:46px}
.card .nm{font-weight:800;font-size:11.5px;min-height:30px;display:flex;align-items:center;justify-content:center}
.card .pr{color:var(--gold);font-weight:900;font-size:11px}
.card .st{font-size:10.5px;color:#9fb4d8}
.card.eq{border-color:#7bf08f;box-shadow:0 0 10px rgba(123,240,143,.35)}
.btn{display:inline-block;background:linear-gradient(#ffe27a,#ffb02e 55%,#f08c12);border:1px solid rgba(255,223,154,.5);box-shadow:0 4px 0 #9c5c08;color:#4a2c00;font-family:inherit;font-weight:900;border-radius:12px;padding:6px 12px;font-size:12px;cursor:pointer;margin:2px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c5c08}
.btn:disabled{filter:grayscale(1) brightness(.55)}
.btn.g{background:linear-gradient(#8fffb0,#2ecc5e 55%,#189a42);color:#04310f;box-shadow:0 4px 0 #0d6b2b}
.btn.b{background:linear-gradient(#8fd4ff,#2f7fe0 55%,#1a5cb0);color:#04264f;box-shadow:0 4px 0 #0e3d78}
.btn.r{background:linear-gradient(#ff9d9d,#e04848 55%,#b02a2a);color:#fff;box-shadow:0 4px 0 #701818}
.btn.p{background:linear-gradient(#e0a8ff,#9448e0 55%,#6c2ab0);color:#fff;box-shadow:0 4px 0 #46177a}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#cfe0ff;border-radius:12px;padding:5px 14px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.tab.on{background:linear-gradient(#ffe27a,#ffb02e);color:#4a2c00}
.cats{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.cats .tab{flex-shrink:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:8px 12px;margin-bottom:7px}
.row img.ri{width:30px;height:30px}
.row .tt{font-weight:800}
.bar{height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fffb0,#22a745)}
.bar.r i{background:linear-gradient(90deg,#ff8f8f,#d63030)}
.bar.b i{background:linear-gradient(90deg,#8fd4ff,#2f7fe0)}
.hint{color:#9fb4d8;font-size:11.5px;line-height:1.8}
input[type=text],input[type=email],input[type=password],input[type=search]{background:rgba(8,18,40,.9);border:1px solid #4c74b8;color:#fff;border-radius:12px;padding:8px 14px;font-family:inherit;font-size:13px;width:100%}
input[type=range]{width:100%;accent-color:#ffcf5c}
#start{position:fixed;inset:0;z-index:100;background:#060d1c;overflow:hidden}
#startbg{position:absolute;inset:0;width:100%;height:100%}
.scontent{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;padding:10px;overflow-y:auto}
.verchip{background:linear-gradient(#ff9d2e,#e0571e);padding:3px 16px;border-radius:20px;font-weight:900;font-size:12px}
.onlineChip{background:linear-gradient(#4dabf7,#1971c2);padding:3px 14px;border-radius:20px;font-weight:800;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.onlineChip .dot{width:8px;height:8px;background:#7bf08f;border-radius:50%;animation:pu 1.4s infinite}
#start h1{font-size:clamp(34px,8vw,64px);font-weight:900;background:linear-gradient(#fff2b0,#ffcf5c 40%,#ff8d1e);-webkit-background-clip:text;background-clip:text;color:transparent}
#start .sub{color:#9fb4d8;font-weight:800;font-size:14px}
.authBox{background:linear-gradient(165deg,rgba(39,64,111,.95),rgba(21,37,68,.95));border:1px solid rgba(255,217,92,.3);border-radius:20px;padding:20px;width:min(420px,92vw)}
.authBox .field{margin-bottom:10px;text-align:right}
.authBox .field label{display:block;font-size:12px;margin-bottom:4px;color:#cfe0ff;font-weight:700}
.authMsg{background:rgba(255,59,59,.15);border:1px solid #ff5c5c;color:#ff8f8f;padding:6px 12px;border-radius:10px;font-size:12px;margin-top:10px;display:none}
.authMsg.ok{background:rgba(46,204,94,.15);border-color:#2ecc5e;color:#8fffb0}
.authMsg.show{display:block}
.guestBtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#cfe0ff;padding:6px 14px;border-radius:10px;font-size:11px;cursor:pointer;font-family:inherit;margin-top:8px}
#credit{position:absolute;bottom:10px;left:0;right:0;z-index:2;font-size:11.5px;color:#7d92b8;line-height:1.9;text-align:center}
#readyTag{position:absolute;top:10px;right:10px;font-size:11px;color:#7bf08f;font-weight:800;display:none;z-index:3}
#rotate{position:fixed;inset:0;z-index:200;background:rgba(6,13,28,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#rotate img{width:70px;height:70px}
@media (orientation:portrait) and (max-width:600px){#rotate{display:flex}}
@media (max-height:430px){#mini{display:none}}
@media (max-width:700px){.nbtn{width:54px;height:58px}.nbtn span{font-size:9px}.chip{font-size:11px}}
#quickBtns{position:fixed;top:88px;right:8px;z-index:9;display:flex;flex-direction:column;gap:10px}
.qbtn{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#a58fff,#6b3fd4 55%,#3a1f7c);border:2px solid rgba(200,180,255,.45);box-shadow:0 4px 0 #2a1558;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.qbtn img{width:22px;height:22px}
.qbtn .bdg{position:absolute;top:-2px;right:-2px;background:#ff3b3b;color:#fff;font-size:10px;font-weight:900;border-radius:9px;padding:1px 5px;min-width:16px;text-align:center}
#chatFloat{position:fixed;bottom:78px;left:8px;width:min(320px,88vw);background:linear-gradient(165deg,rgba(27,43,74,.97),rgba(14,26,56,.97));border:1px solid rgba(255,217,92,.3);border-radius:18px;z-index:8;display:none;flex-direction:column;overflow:hidden}
#chatFloat.on{display:flex}
.chatHead{padding:8px 12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);font-weight:900;font-size:13px}
.chatHead img{width:20px;height:20px}
.chatHead .x{margin-right:auto;background:linear-gradient(#ff6b6b,#c0392b);width:24px;height:24px;border-radius:8px;border:none;color:#fff;font-weight:900;cursor:pointer}
.chatBody{flex:1;overflow-y:auto;padding:8px;max-height:220px;min-height:180px}
.chatMsg{margin-bottom:6px;padding:6px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;font-size:12px}
.chatMsg .nm{font-weight:900;color:var(--gold);font-size:11px}
.chatMsg .tm{font-size:9.5px;color:#7d92b8;margin-right:6px}
.chatMsg .txt{display:block;margin-top:2px}
.chatMsg.me{background:rgba(77,171,247,.15)}
.chatMsg.me .nm{color:#8fd4ff}
.chatInput{display:flex;gap:4px;padding:6px;background:rgba(0,0,0,.25)}
.chatInput input{flex:1;font-size:12px;padding:6px 10px;border-radius:10px}
.chatInput button{width:42px;height:32px;border-radius:10px;border:none;background:linear-gradient(#ffe27a,#ffb02e);color:#4a2c00;font-weight:900;cursor:pointer}
.friendRow{display:flex;align-items:center;gap:10px;padding:8px;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:12px;margin-bottom:6px}
.friendRow .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(#4dabf7,#1971c2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;flex-shrink:0}
.friendRow .info{flex:1}
.friendRow .info .n{font-weight:800;font-size:13px}
.friendRow .info .s{font-size:10.5px;color:#9fb4d8}
.friendRow .info .s.on{color:#7bf08f}
.allianceLogo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:linear-gradient(135deg,#c86bff,#6a2f9e)}
.connStatus{position:fixed;top:6px;left:6px;z-index:11;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:800;display:none}
.connStatus.on{display:block;background:linear-gradient(#7bf08f,#22a745);color:#04310f}
.connStatus.off{display:block;background:linear-gradient(#ff8f8f,#d63030);color:#fff}
/* ═══ الروليت ═══ */
#rouletteOv{position:fixed;inset:0;z-index:200;background:radial-gradient(circle,rgba(60,20,120,.95),rgba(10,5,25,.98));display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#rouletteOv.on{display:flex}
#rouletteCanvas{width:min(500px,90vw);height:min(500px,90vw);filter:drop-shadow(0 0 40px rgba(255,217,92,.6))}
#rouletteTitle{font-size:28px;font-weight:900;color:#ffd95c;text-shadow:0 4px 12px rgba(0,0,0,.8),0 0 20px rgba(255,217,92,.6)}
#rouletteSubtitle{font-size:14px;color:#cfe0ff}
#roulettePrize{font-size:22px;font-weight:900;color:#fff;min-height:32px;text-shadow:0 0 20px rgba(255,217,92,.8)}
#rouletteBtn{padding:12px 40px;font-size:18px;border-radius:18px;background:linear-gradient(#ffe27a,#ffb02e 55%,#f08c12);color:#4a2c00;font-weight:900;border:none;cursor:pointer;box-shadow:0 6px 0 #9c5c08;font-family:inherit}
#rouletteBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #9c5c08}
#rouletteBtn:disabled{filter:grayscale(1) brightness(.6)}
#rouletteClose{position:absolute;top:16px;right:16px;background:linear-gradient(#ff6b6b,#c0392b);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #7c1f14}
/* ═══ المحقق ═══ */
.detectiveBubble{position:fixed;z-index:40;background:linear-gradient(165deg,#2a1a4a,#1a0a2a);border:2px solid #ffd95c;border-radius:16px;padding:12px 16px;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 20px rgba(255,217,92,.4);font-size:13px;line-height:1.6}
.detectiveBubble::before{content:'';position:absolute;bottom:-10px;left:20px;border:6px solid transparent;border-top-color:#ffd95c}
.detectiveBubble .nm{font-weight:900;color:#ffd95c;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.detectiveBubble .txt{color:#e8d8ff}
.detectiveBubble .btn{margin-top:8px}
/* ═══ Dialog زبون ═══ */
#dialogFloat{position:fixed;bottom:80px;right:8px;width:min(340px,90vw);background:linear-gradient(165deg,rgba(60,30,90,.97),rgba(30,15,50,.97));border:2px solid rgba(255,138,176,.5);border-radius:20px;z-index:40;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 20px rgba(255,138,176,.3)}
#dialogFloat.on{display:flex}
.dialogHead{padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-bottom:1px solid rgba(255,138,176,.3)}
.dialogAva{width:42px;height:42px;border-radius:50%;background:linear-gradient(#ff8ab0,#d0547b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #ffd9e8;flex-shrink:0}
.dialogInfo{flex:1}
.dialogInfo .nm{font-weight:900;color:#ff8ab0;font-size:14px}
.dialogInfo .st{font-size:10px;color:#ffd9e8}
.dialogHead .x{background:linear-gradient(#ff6b6b,#c0392b);width:28px;height:28px;border-radius:8px;border:none;color:#fff;font-weight:900;cursor:pointer}
.dialogBody{padding:12px 14px;min-height:120px;font-size:13px;color:#ffd9e8;line-height:1.7}
.dialogBody .quest{background:rgba(255,217,92,.1);border:1px solid rgba(255,217,92,.3);border-radius:10px;padding:8px;margin:8px 0}
.dialogBody .quest .qt{font-weight:900;color:#ffd95c;font-size:12px;margin-bottom:4px}
.dialogActions{padding:10px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid rgba(255,138,176,.2)}
</style>
</head>

<script>
window.__fatal=function(msg){var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;top:6px;left:6px;right:6px;z-index:99999;background:#7f1d1d;border:2px solid #ff6b6b;color:#fff;padding:10px;border-radius:12px;font-size:13px;font-family:Tahoma;direction:rtl;text-align:right;max-height:40%;overflow:auto';document.body.appendChild(d);}d.innerHTML='⚠ <b>خطأ:</b> '+msg;};

</script>
<canvas id="cv"></canvas>
<canvas id="mini" width="132" height="96"></canvas>
<div id="connStat" class="connStatus"></div>
<div id="top">
<div class="chip"><img id="iCoin"><b id="cMoney">0</b></div>
<div class="chip gemv"><img id="iGem"><b id="cGems">0</b></div>
<div class="chip" id="cResBox"></div>
<div class="chip day"><img id="iDay"><span id="cDay"></span></div>

</div>

function drawBiped(g,x,y,o){
var s=o.sc||1,fx=o.fx||1,ph=o.ph||0,mv=o.mv?1:0;
g.save();g.translate(x,y);
g.fillStyle='rgba(10,20,15,.35)';ellipse(g,0,1,13*s,4.5*s);g.fill();
g.scale(s*fx,s);
var bob=Math.abs(Math.sin(ph))*1.8*mv;g.translate(0,-bob);
var fl=o.flash>0;
var cus=o.custom||null;
var fem=cus&&cus.gender==='f';
var skin=fl?'#fff':o.skin,shirt=fl?'#fff':(cus&&cus.shirtC?cus.shirtC:o.shirt),pants=fl?'#fff':(o.pants||'#4a4a5e');
var sw=Math.sin(ph)*(mv?3.2:0);
// ظل تحت القدمين
g.fillStyle='rgba(0,0,0,.18)';rrect(g,-7,-1,14,2,1);g.fill();
// cape
if(o.cape&&!fl){g.fillStyle=o.capeColor||'#c0392b';g.beginPath();g.moveTo(-3,-24);g.quadraticCurveTo(-15-Math.sin(ph)*3,-13,-9,-1);g.lineTo(-1,-4);g.closePath();g.fill();}
// نار
if(o.fire&&!fl){var fg=g.createRadialGradient(0,-20,4,0,-20,26);fg.addColorStop(0,'rgba(255,150,40,.4)');fg.addColorStop(1,'rgba(255,60,10,0)');g.fillStyle=fg;ellipse(g,0,-20,26,26);g.fill();}
// حقيبة ظهر
if(cus&&cus.accV%9===5&&!fl){g.fillStyle='#8a5c34';rrect(g,-14,-24,7,10,2);g.fill();}
// زومبي: يدين ممدودتين
if(o.kind==='z'){g.fillStyle=fl?'#fff':shirt;rrect(g,2,-22,12,4.6,2.2);g.fill();rrect(g,3,-16.5,11,4.6,2.2);g.fill();
g.fillStyle=fl?'#fff':skin;rrect(g,13,-22.6,4.4,5.4,2);g.fill();rrect(g,13,-17,4.4,5.4,2);g.fill();
// ملابس ممزقة للزومبي
if(!fl){g.strokeStyle='rgba(60,20,20,.6)';g.lineWidth=1;g.beginPath();g.moveTo(-6,-20);g.lineTo(-3,-18);g.moveTo(3,-24);g.lineTo(5,-21);g.moveTo(-7,-15);g.lineTo(-4,-12);g.stroke();}}
else{
// ذراع يسار
g.fillStyle=fl?'#fff':shirt;g.save();g.translate(-4.5,-21);g.rotate(-sw*.25);rrect(g,-2.2,0,4.4,11,2.2);g.fill();g.fillStyle=fl?'#fff':skin;ellipse(g,0,11,2.5,2.5);g.fill();g.restore();}
// أرجل
if(!o.robe){g.fillStyle=pants;rrect(g,-6+sw,-13,5.6,12,2.6);g.fill();rrect(g,.8-sw,-13,5.6,12,2.6);g.fill();
g.fillStyle=fl?'#fff':'#2f2419';rrect(g,-6.6+sw,-3,7.4,3.6,1.6);g.fill();rrect(g,.4-sw,-3,7.4,3.6,1.6);g.fill();

var rouletteCtx=null,rouletteAnimId=null;
function openRoulette(){
$('#rouletteOv').classList.add('on');
var cv=document.getElementById('rouletteCanvas');
rouletteCtx=cv.getContext('2d');
ROULETTE.angle=0;ROULETTE.spinning=false;ROULETTE.velocity=0;
$('#roulettePrize').textContent='اضغط الزر لبدء الدوران';
var btn=document.getElementById('rouletteBtn');
var canSpin=Date.now()-ST.rouletteLast>=86400000;
btn.disabled=!canSpin;
btn.textContent=canSpin?'🎲 ابدأ الدوران':'عد غداً!';
drawRoulette();}
function drawRoulette(){
if(!rouletteCtx)return;
var cv=rouletteCtx.canvas;var cx=cv.width/2,cy=cv.height/2,r=cv.width/2-20;
rouletteCtx.clearRect(0,0,cv.width,cv.height);
// دائرة خارجية متوهجة
rouletteCtx.save();
rouletteCtx.shadowColor='#ffd95c';rouletteCtx.shadowBlur=30;
rouletteCtx.strokeStyle='#ffd95c';rouletteCtx.lineWidth=4;
rouletteCtx.beginPath();rouletteCtx.arc(cx,cy,r+10,0,Math.PI*2);rouletteCtx.stroke();
rouletteCtx.restore();
// قطاعات
var n=ROULETTE_PRIZES.length;
var slice=Math.PI*2/n;
for(var i=0;i<n;i++){
var a=ROULETTE.angle+i*slice;
var prize=ROULETTE_PRIZES[i];
// قطاع
rouletteCtx.fillStyle=prize.c;
rouletteCtx.beginPath();rouletteCtx.moveTo(cx,cy);rouletteCtx.arc(cx,cy,r,a,a+slice);rouletteCtx.closePath();rouletteCtx.fill();
// خط فاصل
rouletteCtx.strokeStyle='#fff';rouletteCtx.lineWidth=2;
rouletteCtx.beginPath();rouletteCtx.moveTo(cx,cy);rouletteCtx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);rouletteCtx.stroke();
// نص
rouletteCtx.save();rouletteCtx.translate(cx,cy);rouletteCtx.rotate(a+slice/2);
rouletteCtx.fillStyle='#fff';rouletteCtx.font='bold 14px Tahoma';rouletteCtx.textAlign='center';
rouletteCtx.shadowColor='rgba(0,0,0,.7)';rouletteCtx.shadowBlur=4;
rouletteCtx.fillText(prize.n,r*.65,5);
rouletteCtx.restore();
// أيقونة
var img=new Image();img.src=IC[prize.ic];
rouletteCtx.save();rouletteCtx.translate(cx,cy);rouletteCtx.rotate(a+slice/2);
try{rouletteCtx.drawImage(img,r*.35-10,-10,20,20);}catch(e){}
rouletteCtx.restore();}
// مركز
rouletteCtx.fillStyle='#fff';
rouletteCtx.beginPath();rouletteCtx.arc(cx,cy,20,0,Math.PI*2);rouletteCtx.fill();
rouletteCtx.fillStyle='#ffd95c';
star(rouletteCtx,cx,cy,15,7,5);rouletteCtx.fill();
// سهم
rouletteCtx.fillStyle='#c0392b';
rouletteCtx.beginPath();rouletteCtx.moveTo(cx+r+15,cy);rouletteCtx.lineTo(cx+r-5,cy-10);rouletteCtx.lineTo(cx+r-5,cy+10);rouletteCtx.closePath();rouletteCtx.fill();
rouletteCtx.strokeStyle='#fff';rouletteCtx.lineWidth=2;rouletteCtx.stroke();}
function spinRoulette(){
if(ROULETTE.spinning)return;
var canSpin=Date.now()-ST.rouletteLast>=86400000;
if(!canSpin){toast('عد غداً لتجربة حظك!','red');return;}
ROULETTE.spinning=true;ROULETTE.velocity=rnd(.4,.6);
var btn=document.getElementById('rouletteBtn');
btn.disabled=true;btn.textContent='يدور...';
var n=ROULETTE_PRIZES.length;
var targetIdx=Math.floor(Math.random()*n);
var targetAngle=-targetIdx*(Math.PI*2/n)-Math.PI*2*5;
var startTime=Date.now();var duration=5000;
var startAngle=ROULETTE.angle;
function animate(){
var elapsed=Date.now()-startTime;var progress=Math.min(elapsed/duration,1);
var ease=1-Math.pow(1-progress,4);
ROULETTE.angle=startAngle+(targetAngle-startAngle)*ease;
drawRoulette();
if(progress<1){rouletteAnimId=requestAnimationFrame(animate);}
else{
ROULETTE.spinning=false;
var prize=ROULETTE_PRIZES[targetIdx];
prize.fn();
ST.rouletteLast=Date.now();
$('#roulettePrize').textContent='🎉 مبروك! فزت: '+prize.n;
sfx('win');
sparkle(P.x,P.y-20,'#ffd95c',30);
toast(I('gift')+' ربحت: '+prize.n+'!','gold');
save();hud();
setTimeout(function(){btn.disabled=false;btn.textContent='عد غداً';},1000);}}
rouletteAnimId=requestAnimationFrame(animate);}
$('#rouletteBtn').onclick=spinRoulette;
$('#rouletteClose').onclick=function(){$('#rouletteOv').classList.remove('on');if(rouletteAnimId)cancelAnimationFrame(rouletteAnimId);};

if(!blocked){bd=d3;bs='custom_'+px+'_'+py;}}}
if(bs===-1){toast('اضغط على موقع منقّط (أصفر) حول المتجر','red');return;}

function placeBuilding(bid,x,y){

function initMega() {

        peds: [], cars: [], birds: [],

    // ══════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════
    var _o_spawnZombie = window.spawnZombie;
    window.spawnZombie = function(t) {
        // 25% من الزومبي يرسبنون من الجنوب (قريب من المتجر)
        var side = irnd(0, 3);
        var x, y;
        if(side === 0) { x = rnd(4*T, (WW-4)*T); y = 1.2*T; }
        else if(side === 1) { x = 1.2*T; y = rnd(4*T, (WH-16)*T); }
        else if(side === 2) { x = (WW-1.2)*T; y = rnd(4*T, (WH-16)*T); }
        else { x = 31.5*T + rnd(-8*T, 8*T); y = (WH-2)*T; } // قريب!
        
        var Z = ZTYPES[t];
        var hm = 1 + (ST.wave-1)*.12, dm = 1 + (ST.wave-1)*.06;
        E.zombies.push({
            x:x, y:y, t:t,
            hp: Z.hp*hm, max: Z.hp*hm,
            dmg: Z.dmg*dm, spd: Z.spd*rnd(.85, 1.15),
            sc: Z.sc, atkCd: 0, flash: 0,
            ph: rnd(0, 6), spawn: .4,
            color: Z.color, slowT: 0, stealCd: 0,
            pref: null, seed: Math.random()*9
        });
    };

    window.updZombies = function(dt) {
        var gx = SHOP_DOOR.x, gy = SHOP_DOOR.y;
        var farmCx = FARM.x + 7*T, farmCy = FARM.y + 11*T;
        
        for(var i = E.zombies.length - 1; i >= 0; i--) {            var z = E.zombies[i];
            if(!z) continue;
            z.atkCd -= dt;
            z.stealCd = (z.stealCd || 0) - dt;
            if(z.flash > 0) z.flash -= dt;
            if(z.spawn < 1) z.spawn = Math.min(1, z.spawn + dt*3);
            
            var ZT = ZTYPES[z.t];
            if(ZT && ZT.fire && Math.random() < .15)
                E.parts.push({kind:'glow', x:z.x+rnd(-8,8), y:z.y-rnd(10,30), vx:0, vy:-30, c:'#ff7a2e', t:.5});
            
            // اختيار هدف بذكاء
            var targets = [];
            
            // اللاعب (أعلى أولوية إذا قريب)
            if(!P.dead && dist(z.x, z.y, P.x, P.y) < 260) {
                var dp = dist(z.x, z.y, P.x, P.y);
                targets.push({x:P.x, y:P.y, kind:'p', d:dp*0.8});
            }
            
            // الحيوانات
            for(var ai = 0; ai < E.animals.length; ai++) {
                var a = E.animals[ai];
                var ad = dist(z.x, z.y, a.x, a.y);
                if(ad < 200) targets.push({x:a.x, y:a.y, kind:'a', d:ad, idx:ai});
            }
            
            // الدفاعات
            for(var di = 0; di < E.defs.length; di++) {
                var dd0 = E.defs[di];
                if(dd0.hp <= 0) continue;
                var dd = dist(z.x, z.y, dd0.x, dd0.y);
                if(dd < 250) targets.push({x:dd0.x, y:dd0.y, kind:'d', d:dd, idx:di});
            }
            
            // مباني اللاعب (جديد!)
            for(var bi = 0; bi < E.buildings.length; bi++) {

                    if(bl2.hp === undefined) {

                        bl2.max = bdef ? bdef.hp : 300;
                        bl2.hp = bl2.max;

                        z.atkCd = 1;

                        sfx('hit');

            // هجوم على المزرعة - دوس المحاصيل (جديد!)

                if(z.atkCd <= 0) {
                    z.atkCd = 1;

                        var pl = ST.plots[pi];

                z.fa = a;
                z.ph += dt * (z.t === 'f' ? 14 : 8);
            }
            
            if(z.hp <= 0) killZombie(i);

    };

            var z = E.zombies[i];
            var d = dist(H.x, H.y, z.x, z.y);
            if(d < td) { td = d; tgt = z; }
        }
        if(tgt && td < 220) {
            var a = Math.atan2(tgt.y - H.y, tgt.x - H.x);
            H.fa = a;
            if(td > 30) {
                H.x += Math.cos(a) * 130 * dt;
                H.y += Math.sin(a) * 130 * dt;
                H.ph += dt * 11;
            } else if(H.cd <= 0) {
                H.cd = .8; H.atk = .25;
                tgt.hp -= H.dmg; tgt.flash = .15; sfx('hit');
                if(tgt.hp <= 0) {
                    var hIdx = E.zombies.indexOf(tgt);
                    if(hIdx >= 0) killZombie(hIdx);
                }
            }
            if(H.sk <= 0 && E.zombies.length >= 3) {
                H.sk = 20; shake = 4;
                for(var j = 0; j < E.zombies.length; j++)
                    if(dist(H.x, H.y, E.zombies[j].x, E.zombies[j].y) < 110)
                        E.zombies[j].hp -= H.dmg * 2;
                toast(I('bolt') + ' دوامة البطل!', 'gold');
            }
        } else {
            var tx = P.x + 30, ty = P.y + 10;
            var d2 = dist(H.x, H.y, tx, ty);
            if(d2 > 40) {
                var a2 = Math.atan2(ty - H.y, tx - H.x);
                H.fa = a2;
                H.x += Math.cos(a2) * 150 * dt;
                H.y += Math.sin(a2) * 150 * dt;
                H.ph += dt * 11;
            }
        }
        if(H.atk > 0) H.atk -= dt;
    };

    // ══════════════════════════════════════════════════════
    // [3] نظام البناء الفعلي (سقالات + عمال + شريط تقدم)
    // ══════════════════════════════════════════════════════
    var _o_placeBuilding = window.placeBuilding;    window.placeBuilding = function(bid, x, y) {
        var oldLen = ST.buildings ? ST.buildings.length : 0;
        if(_o_placeBuilding) _o_placeBuilding(bid, x, y);
        if(ST.buildings && ST.buildings.length > oldLen) {
            var b = ST.buildings[ST.buildings.length - 1];
            b.mega_buildT = 0;
            b.mega_buildMax = 20;
        }
    };

    // ══════════════════════════════════════════════════════
    // [4] المحقق السينمائي (3 أنواع + أشرطة + مهام)
    // ══════════════════════════════════════════════════════
    var DET_TYPES = [
        {nm:'المحقق رعد', th:'الجرائم', q:{kind:'kill', n:8}, rw:{money:500, gems:5}},
        {nm:'المحققة نور', th:'الزومبي', q:{kind:'kill', n:15}, rw:{money:800, gems:10}},
        {nm:'المحقق سالم', th:'الموارد', q:{kind:'collect', n:200}, rw:{gems:15}}
    ];
    var lbT = null, lbB = null;
    function letterbox(on) {
        if(!lbT) {
            lbT = document.createElement('div');
            lbB = document.createElement('div');
            var s = 'position:fixed;left:0;right:0;height:0;background:#000;z-index:9999;transition:height .6s;pointer-events:none;';
            lbT.style.cssText = s + 'top:0;';
            lbB.style.cssText = s + 'bottom:0;';
            document.body.appendChild(lbT);
            document.body.appendChild(lbB);
        }
        lbT.style.height = on ? '10%' : '0';
        lbB.style.height = on ? '10%' : '0';
    }

    var _o_spawnDet = window.spawnDetective;
    window.spawnDetective = function() {
        M.detType = pick(DET_TYPES);
        letterbox(true);
        setTimeout(function() { letterbox(false); }, 4000);
        toast('🚔 ' + M.detType.nm + ' (' + M.detType.th + ') قادم!', 'big');
        if(_o_spawnDet) _o_spawnDet();
    };

    var _o_eval = window.evaluateShop;
    window.evaluateShop = function() {
        var res = _o_eval ? _o_eval() : {good:true};
        if(M.detType && !M.quest) {
            M.quest = {
                kind: M.detType.q.kind, n: M.detType.q.n, prog: 0,
                base: ST.money, rw: M.detType.rw, who: M.detType.nm
            };            toast('📜 مهمة ' + M.detType.nm + ' بدأت!', 'cop');
        }
        return res;
    };

    // ══════════════════════════════════════════════════════
    // [5] قصص الزبائن
    // ══════════════════════════════════════════════════════
    var STORIES = [
        {t:'فقدت منزلي... شكراً لك.', rw:function() { ST.rep = (ST.rep || 0) + 3; }},
        {t:'أبحث عن عائلتي...', rw:function() { gainXP(20); }},
        {t:'سمعت عن متجرك!', rw:function() { ST.money += 100; }},
        {t:'لدي سر: كنز مدفون...', rw:function() { spawnTreasure(); }}
    ];
    var _o_spawnCust = window.spawnCustomer;
    window.spawnCustomer = function() {
        if(_o_spawnCust) _o_spawnCust();
        var c = E.customers[E.customers.length - 1];
        if(c && Math.random() < 0.2) c.mega_story = pick(STORIES);
    };

    // ══════════════════════════════════════════════════════
    // [6] الأحداث الكنز
    // ══════════════════════════════════════════════════════
    function spawnTreasure() {
        M.treas = {x: rnd(24*T, 42*T), y: rnd(24*T, 31*T), t: 60};
        toast('🗺️ كنز مخفي! ابحث عن ✖ الذهبية', 'big');
    }
    window.spawnTreasure = spawnTreasure;

    function megaEvent() {
        var r = Math.random();
        if(r < 0.15) { 
            if(!E.merchant) {
                E.merchant = {x:27*T, y:33*T, t:80, offers:mkOffers()};
                M.caravanT = 80;
                toast('🐪 قافلة تجارية وصلت!', 'big');
            }
        } else if(r < 0.3) { spawnTreasure(); } 
        else if(r < 0.45) { 
            M.surv = {t: 30};
            toast('🙏 ناجون عند البوابة! (+سمعة)', 'cop');
            setTimeout(function() {
                if(M.surv) { ST.rep = (ST.rep || 0) + 5; ST.gems += 2; toast('👨 انضم الناجون!', 'gold'); M.surv = null; }
            }, 5000);
        } else if(r < 0.6) { 
            M.stormT = 45; ST.weather = 'عاصفة'; toast('⛈️ عاصفة! الإنتاج -50%', 'red'); 
        } else if(r < 0.75) { 
            M.celeb = {x: 31.5*T, y: (WH-2)*T, st:'in', t:0}; toast('⭐ شخصية مشهورة تزور المتجر!', 'big'); 
        } else if(r < 0.9) {             var k = pick(['wood','stone','metal','herb']);
            var am = Math.min(ST.res[k], irnd(10, 30));
            ST.res[k] -= am; toast('🦹 سرقة! فُقد ' + am + ' مورد', 'red');
        }
    }

    // ══════════════════════════════════════════════════════
    // [7] الحلقة الإضافية (عالم حي + بناء)
    // ══════════════════════════════════════════════════════
    function mega_update(dt) {
        if(!ST) return;
        // تقدم البناء
        if(ST.buildings) {
            for(var i = 0; i < ST.buildings.length; i++) {
                var b = ST.buildings[i];
                if(b.mega_buildT !== undefined && b.mega_buildT < b.mega_buildMax) {
                    b.mega_buildT += dt * (M.heroes.nour ? 1.5 : 1);
                    if(b.mega_buildT >= b.mega_buildMax) {
                        b.mega_buildT = b.mega_buildMax;
                        sparkle(b.x, b.y, '#ffd95c', 20); sfx('chest');
                        var bd = BUILDINGS.filter(function(x) { return x.id === b.id; })[0];
                        toast('🎉 اكتمل بناء ' + (bd ? bd.n : 'المبنى') + '!', 'big');
                    }
                }
            }
        }
        // مشاة
        while(M.peds.length < 4) M.peds.push({x: rnd(22*T, 42*T), y: rnd(12*T, 30*T), tx:0, ty:0, ph: rnd(0, 9), sp: rnd(20, 40), shirt: pick(['#c0392b', '#2980b9', '#8e44ad', '#16a085'])});
        for(var i = 0; i < M.peds.length; i++) {
            var p = M.peds[i];
            if(dist(p.x, p.y, p.tx, p.ty) < 10 || !p.tx) { var s = pick(DSLOTS); p.tx = s.x; p.ty = s.y; }
            var a = Math.atan2(p.ty - p.y, p.tx - p.x);
            p.x += Math.cos(a) * p.sp * dt; p.y += Math.sin(a) * p.sp * dt; p.ph += dt * 8;
        }
        // سيارات
        M.carT -= dt;
        if(M.carT <= 0) { M.carT = rnd(12, 22); M.cars.push({x: 32.6*T, y: (WH+1)*T, sp: rnd(90, 140), c: pick(['#e74c3c', '#3498db', '#f39c12'])}); }
        for(var i = M.cars.length - 1; i >= 0; i--) { M.cars[i].y -= M.cars[i].sp * dt; if(M.cars[i].y < 33*T) M.cars.splice(i, 1); }
        // طيور
        M.birdT -= dt;
        if(M.birdT <= 0) { M.birdT = rnd(8, 16); M.birds.push({x: -40, y: rnd(60, 200), vx: rnd(60, 110), t: 0}); }
        for(var i = M.birds.length - 1; i >= 0; i--) { M.birds[i].t += dt; M.birds[i].x += M.birds[i].vx * dt; if(M.birds[i].x > VW + 60) M.birds.splice(i, 1); }
        // أحداث
        M.evT -= dt; if(M.evT <= 0) { M.evT = rnd(60, 110); megaEvent(); }
        // كنز
        if(M.treas) {
            M.treas.t -= dt;
            if(M.treas.t <= 0) M.treas = null;
            else if(dist(P.x, P.y, M.treas.x, M.treas.y) < 40) {
                var rw = irnd(200, 800); ST.money += rw;                toast('💰 كنز! +' + rw, 'big'); sparkle(P.x, P.y, '#ffd95c', 30); sfx('chest');
                M.treas = null; M.secrets.treasure++;
            }
        }
        // مشهور
        if(M.celeb) {
            var cb = M.celeb;
            if(cb.st === 'in') { cb.y -= 40 * dt; if(cb.y < SHOP_DOOR.y + 40) { cb.st = 'stay'; cb.t = 5; } } 
            else if(cb.st === 'stay') { cb.t -= dt; if(cb.t <= 0) { cb.st = 'out'; ST.money += 500; ST.rep = (ST.rep || 0) + 10; toast('⭐ انتهت الزيارة! +500🪙', 'big'); } } 
            else { cb.y += 80 * dt; if(cb.y > WH*T) M.celeb = null; }
        }
        // عاصفة
        if(M.stormT > 0) { M.stormT -= dt; if(M.stormT <= 0) rollWeather(); }
        // مهام
        if(M.quest) {
            if(M.quest.kind === 'collect') M.quest.prog = ST.money - M.quest.base;
            if(M.quest.prog >= M.quest.n) {
                if(M.quest.rw.money) ST.money += M.quest.rw.money;
                if(M.quest.rw.gems) ST.gems += M.quest.rw.gems;
                toast('🎖️ أنجزت مهمة ' + M.quest.who + '!', 'big'); sfx('win'); M.quest = null;
            }
        }
    }

    // ══════════════════════════════════════════════════════
    // [8] الرسم الإضافي
    // ══════════════════════════════════════════════════════
    function mega_render() {
        if(!ST || !ctx) return;
        // سقالات البناء
        if(ST.buildings) {
            for(var i = 0; i < ST.buildings.length; i++) {
                var b = ST.buildings[i];
                if(b.mega_buildT !== undefined && b.mega_buildT < b.mega_buildMax) {
                    var x = b.x - cam.x, y = b.y - cam.y;
                    var p = b.mega_buildT / b.mega_buildMax;
                    ctx.globalAlpha = 0.6; ctx.fillStyle = '#8a5c34';
                    rrect(ctx, x - 24, y - 16, 48, 32, 4); ctx.fill(); ctx.globalAlpha = 1;
                    ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(ctx, x - 24, y - 34, 48, 6, 3); ctx.fill();
                    ctx.fillStyle = '#f39c12'; rrect(ctx, x - 24, y - 34, 48 * p, 6, 3); ctx.fill();
                    drawBiped(ctx, x - 10, y + 10, {sc:0.8, fx:1, ph:perf/120, mv:true, kind:'p', skin:'#d9a066', shirt:'#e67e22', pants:'#4a4a5e', hat:'cap', capColor:'#f1c40f'});
                    drawBiped(ctx, x + 10, y + 10, {sc:0.8, fx:-1, ph:perf/120 + 2, mv:true, kind:'p', skin:'#d9a066', shirt:'#e67e22', pants:'#4a4a5e', hat:'cap', capColor:'#f1c40f'});
                }
            }
        }
        // مشاة
        for(var i = 0; i < M.peds.length; i++) {
            var p = M.peds[i], px = p.x - cam.x, py = p.y - cam.y;
            if(px > -50 && px < VW + 50) drawBiped(ctx, px, py, {sc:0.95, fx:Math.cos(Math.atan2(p.ty - p.y, p.tx - p.x)) >= 0 ? 1 : -1, ph:p.ph, mv:true, kind:'p', skin:'#f0c8a0', shirt:p.shirt, pants:'#4a4a5e'});
        }        // سيارات
        for(var i = 0; i < M.cars.length; i++) {
            var c = M.cars[i], cx = c.x - cam.x, cy = c.y - cam.y;
            ctx.fillStyle = c.c; rrect(ctx, cx - 11, cy - 20, 22, 34, 6); ctx.fill();
            ctx.fillStyle = '#2c3e50'; rrect(ctx, cx - 8, cy - 12, 16, 10, 3); ctx.fill();
        }
        // طيور
        ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
        for(var i = 0; i < M.birds.length; i++) {
            var b = M.birds[i], bx = b.x - cam.x, by = b.y - cam.y + Math.sin(b.t * 3) * 6, fl = Math.sin(b.t * 10) * 4;
            ctx.beginPath(); ctx.moveTo(bx - 6, by); ctx.quadraticCurveTo(bx - 3, by - fl, bx, by); ctx.quadraticCurveTo(bx + 3, by - fl, bx + 6, by); ctx.stroke();
        }
        // كنز
        if(M.treas) { var tx = M.treas.x - cam.x, ty = M.treas.y - cam.y; ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 24px Tahoma'; ctx.textAlign = 'center'; ctx.fillText('✖', tx, ty); }
        // مشهور
        if(M.celeb) drawBiped(ctx, M.celeb.x - cam.x, M.celeb.y - cam.y, {sc:1.1, fx:1, ph:perf/150, mv:true, kind:'p', skin:'#f0c8a0', shirt:'#f1c40f', pants:'#2a2a2a', crown:true, nameLabel:'⭐ مشهور', nameColor:'#ffd95c'});
    }

    // ══════════════════════════════════════════════════════
    // [9] دمج الحلقات بأمان
    // ══════════════════════════════════════════════════════
    var _o_update = window.update;
    window.update = function(dt) { if(_o_update) _o_update(dt); mega_update(dt); };
    var _o_render = window.render;
    window.render = function() { if(_o_render) _o_render(); mega_render(); };

    // ══════════════════════════════════════════════════════
    // [10] واجهة المدينة والأبطال
    // ══════════════════════════════════════════════════════
    var cityBtn = document.createElement('button');
    cityBtn.className = 'qbtn';
    cityBtn.innerHTML = '<span style="font-size:20px">🏙️</span>';
    cityBtn.style.background = 'radial-gradient(circle at 32% 28%,#ffd95c,#ff9d2e 55%,#b06a12)';
    cityBtn.onclick = function() {
        initAudio();
        openP('المدينة', function() {
            var h = '<div class="row"><span>🏙️ السمعة: <b>' + (ST.rep || 0) + '</b></span></div>';
            h += '<div class="row"><button class="btn g" id="mDecF">🍞 توزيع طعام (+8 سمعة)</button></div>';
            h += '<div class="row"><button class="btn" id="mDecT">💰 ضريبة (+50🪙 -5 سمعة)</button></div>';
            h += '<div class="row"><div style="flex:1"><div class="tt">👷‍♀️ نور: بناء أسرع</div></div>' + (M.heroes.nour ? '<span>✓</span>' : '<button class="btn" id="mHeroN">2500🪙</button>') + '</div>';
            h += '<div class="row"><div style="flex:1"><div class="tt">💼 كريم: أسعار +15%</div></div>' + (M.heroes.kareem ? '<span>✓</span>' : '<button class="btn" id="mHeroK">4000🪙</button>') + '</div>';
            return h;
        }, 'people');
        setTimeout(function() {
            var df = document.getElementById('mDecF'), dt2 = document.getElementById('mDecT'), hn = document.getElementById('mHeroN'), hk = document.getElementById('mHeroK');
            if(df) df.onclick = function() { ST.rep = (ST.rep || 0) + 8; toast('🍞 +8 سمعة', 'gold'); refreshP(); };
            if(dt2) dt2.onclick = function() { ST.money += 50; ST.rep = Math.max(0, (ST.rep || 0) - 5); toast('💰 +50🪙 -5 سمعة'); refreshP(); };
            if(hn) hn.onclick = function() { if(ST.money >= 2500) { ST.money -= 2500; M.heroes.nour = 1; toast('👷‍♀️ انضمت نور!', 'big'); refreshP(); } else toast('مال غير كافٍ', 'red'); };
            if(hk) hk.onclick = function() { if(ST.money >= 4000) { ST.money -= 4000; M.heroes.kareem = 1; toast('💼 انضم كريم!', 'big'); refreshP(); } else toast('مال غير كافٍ', 'red'); };
        }, 100);    };
    var qb = document.getElementById('quickBtns');
    if(qb) qb.appendChild(cityBtn);

    // ══════════════════════════════════════════════════════
    // [11] لفافات اقتصادية
    // ══════════════════════════════════════════════════════
    var _o_salePrice = window.salePrice;
    window.salePrice = function(p) { var v = _o_salePrice ? _o_salePrice(p) : p.base; if(M.heroes.kareem) v = Math.round(v * 1.15); return v; };
    var _o_killZombie = window.killZombie;
    window.killZombie = function(i) { if(M.quest && M.quest.kind === 'kill') M.quest.prog++; if(_o_killZombie) _o_killZombie(i); };

    // ══════════════════════════════════════════════════════
    // [12] حفظ وتحميل
    // ══════════════════════════════════════════════════════
    setInterval(function() { if(ST) { try { localStorage.setItem('mega_v8', JSON.stringify({heroes: M.heroes, secrets: M.secrets})); } catch(e){} } }, 8000);
    try { var j = JSON.parse(localStorage.getItem('mega_v8') || 'null'); if(j) { M.heroes = j.heroes || M.heroes; M.secrets = j.secrets || M.secrets; } } catch(e){}

    console.log('%c⚡ MEGA EVOLUTION V8 ✓ (ذكاء زومبي محسّن)', 'color:#ffd95c;font-weight:bold');
    setTimeout(function() { toast('⚡ MEGA V8: ذكاء زومبي + بناء حقيقي + محقق + عالم حي!', 'big'); }, 1500);
}

var megaWait = setInterval(function() {
    if(window.ST || document.getElementById('cv')) { clearInterval(megaWait); setTimeout(initMega, 1000); }
}, 500);
})();
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   WORLD EXPANSION UPDATE — توسعة العالم (بلوك مستقل)

(function(){'use strict';
function initWX(){
if(window.WXP_INIT)return;
window.WXP_INIT=true;
var WX=window.WXP={fires:[],resN:[],cityN:[],projs:[],spray:0,inCave:false,inCity:false,zone:'',quest:null,heroEv:null,eagle:null,caveLeft:0,secrets:{},bossKills:0,cd:{},heroT:150,eagleT:120,fxT:0};

/* ══ [1] وحوش جديدة (إضافة آمنة لأنواع الزومبي) ══ */
ZTYPES.st={n:'حجري',hp:400,dmg:20,spd:10,sc:1.8,color:'#86919c'};

/* ══ [2] دفاعات جديدة في لوحة الدفاع ══ */
DEFS.mgun={n:'برج رشاش',ic:'gun',hp:140,cost:{metal:20,wood:10},d:'نيران سريعة'};
DEFS.rocket={n:'برج صواريخ',ic:'bomb',hp:120,cost:{metal:35,stone:10},d:'انفجارات'};
DEFS.city={n:'مركز الدفاع',ic:'shield',hp:300,cost:{metal:40,stone:30,wood:20},d:'قصف مدفعي'};

/* ══ [3] إصلاح خطأ updNodes المخفي (المتغير y) ══ */
window.updNodes=function(dt){for(var i=0;i<E.nodes.length;i++){var n=E.nodes[i];if(n.hitT>0)n.hitT-=dt;

<script>
/* ═══ ZRUN: زومبي الجري الجديد (قصّ نظيف + القياس الأصلي) ═══ */
(function(){'use strict';
if(window.ZRUN)return;window.ZRUN=true;
var FILES={green:'z_green.png',red:'z_red.png',blue:'z_blue.png',yellow:'z_yellow.png',purple:'z_purple.png'};
var ZMAP={n:'green',f:'yellow',a:'blue',g:'red',fi:'red',po:'yellow',b:'purple',ra:'purple',fr:'blue',el:'yellow',mu:'purple',gh:'green',bo:'red',ne:'purple',ul:'purple'};
var ZS={};
function cleanAndCut(img){
var w=img.naturalWidth,h=img.naturalHeight;
var c=document.createElement('canvas');c.width=w;c.height=h;
var g=c.getContext('2d');g.drawImage(img,0,0);
var d=g.getImageData(0,0,w,h),p=d.data;
/* 1) حذف الخلفية البيضاء/الشفافة المتصلة بالحواف فقط */
var seen=new Uint8Array(w*h),q=[],x,y;
function ok(i){if(p[i+3]<10)return true;var r=p[i],gg=p[i+1],b=p[i+2];var mn=Math.min(r,gg,b),mx=Math.max(r,gg,b);return (mx-mn)<25&&mn>200;}
function push(a,b){var id=b*w+a;if(seen[id])return;if(!ok(id*4))return;seen[id]=1;q.push(id);}
for(x=0;x<w;x++){push(x,0);push(x,h-1);}
for(y=0;y<h;y++){push(0,y);push(w-1,y);}
while(q.length){var id=q.pop();p[id*4+3]=0;var xx=id%w,yy=(id-xx)/w;
if(xx>0)push(xx-1,yy);if(xx<w-1)push(xx+1,yy);if(yy>0)push(xx,yy-1);if(yy<h-1)push(xx,yy+1);}
g.putImageData(d,0,0);
/* 2) مكوّنات متصلة → أكبر 4 (تجاهل النصوص الصغيرة) */
var seen2=new Uint8Array(w*h),comps=[];
for(var y2=0;y2<h;y2++)for(var x2=0;x2<w;x2++){var id2=y2*w+x2;if(seen2[id2]||p[id2*4+3]<25)continue;
seen2[id2]=1;var st=[id2],minx=x2,maxx=x2,miny=y2,maxy=y2;
while(st.length){var cur=st.pop(),cx=cur%w,cy=(cur-cx)/w;
if(cx<minx)minx=cx;if(cx>maxx)maxx=cx;if(cy<miny)miny=cy;if(cy>maxy)maxy=cy;
var nb=[cur+1,cur-1,cur+w,cur-w];
for(var k=0;k<4;k++){var n2=nb[k];if(n2<0||n2>=w*h)continue;var nx2=n2%w;
if(k===0&&nx2===0)continue;if(k===1&&nx2===w-1)continue;
if(seen2[n2]||p[n2*4+3]<25)continue;seen2[n2]=1;st.push(n2);}}
if(maxy-miny>h*.35)comps.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1});}
comps.sort(function(a,b){return a.x-b.x;});
var fr=[];
for(var i=0;i<comps.length&&fr.length<4;i++){var b2=comps[i];
var cc=document.createElement('canvas');cc.width=b2.w;cc.height=b2.h;
cc.getContext('2d').drawImage(c,b2.x,b2.y,b2.w,b2.h,0,0,b2.w,b2.h);
fr.push(cc);}
return fr;}
for(var key in FILES){(function(key){var im=new Image();
im.onload=function(){var fr=cleanAndCut(im);if(fr.length)ZS[key]=fr;
if(window.toast)toast('🧟 '+key+' ✓ ('+fr.length+' إطار)','gold');};
im.onerror=function(){if(window.toast)toast('⚠️ ارفع '+FILES[key],'red');};
im.src=FILES[key];})(key);}
/* حالات الهجوم */
var _up=window.update;
window.update=function(dt){_up(dt);if(!window.E)return;
for(var i=0;i<E.zombies.length;i++){var z=E.zombies[i];
if(z.atkCd>0.75){z.__atk=0.3;z.__aT=(z.__aT||0)+dt;}else z.__atk=Math.max(0,(z.__atk||0)-dt);}};
function findZ(x,y){for(var i=0;i<E.zombies.length;i++){var z=E.zombies[i];
if(Math.abs(z.x-cam.x-x)<3&&Math.abs(z.y-cam.y-y)<3)return z;}return null;}
/* الرسم بالقياس الأصلي (48×المقياس) */
function drawRun(g,x,y,o,z,F){
var sc=o.sc||1;
var hgt=48*sc;
var fi=(z.__atk>0)?Math.floor(z.__aT*10):Math.floor(z.ph*2.2);
var f=F[Math.abs(fi)%F.length];if(!f)return;
var wdt=f.width*(hgt/f.height);
g.save();g.translate(x,y);
g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,1,wdt*.35,4.5*sc,0,0,7);g.fill();
g.scale(o.fx||1,1);
if(o.flash>0){try{g.filter='brightness(2.5)';}catch(e){}}
if(z.t==='gh')g.globalAlpha=.6;
g.drawImage(f,-wdt/2,2-hgt,wdt,hgt);
g.restore();}
var _db=window.drawBiped;
window.drawBiped=function(g,x,y,o){
if(o&&o.kind==='z'&&window.E&&window.E.zombies){var z=findZ(x,y);
if(z){var F=ZS[ZMAP[z.t]||'green'];
if(F&&F.length){drawRun(g,x,y,o,z,F);return;}}}
return _db(g,x,y,o);};
/* الموت: سقوط + تلاشٍ */
var corpses=[];
var _kz=window.killZombie;
window.killZombie=function(i){var z=E.zombies[i];
if(z&&corpses.length<40)corpses.push({x:z.x,y:z.y,t:0,fx:Math.cos(z.fa||0)>=0?1:-1,s:z.sc,k:ZMAP[z.t]||'green'});
_kz(i);};
var _ren=window.render;
window.render=function(){_ren();if(!window.ST)return;
for(var i=corpses.length-1;i>=0;i--){var c=corpses[i];c.t+=1/60;
var F=ZS[c.k];if(!F||!F.length){corpses.splice(i,1);continue;}
var f=F[F.length-1];
var hgt=48*c.s,wdt=f.width*(hgt/f.height);
var x=c.x-cam.x,y=c.y-cam.y;
ctx.save();ctx.translate(x,y);ctx.scale(c.fx||1,1);
ctx.rotate(-Math.min(1,c.t*2.5)*1.4);
ctx.globalAlpha=Math.max(0,1-(c.t-0.8)/0.8);
ctx.drawImage(f,-wdt/2,2-hgt,wdt,hgt);
ctx.restore();
if(c.t>1.6)corpses.splice(i,1);}};
console.log('ZRUN ✓');
})();
</script>
<script>
/* ═══ FARM-SKIN: صورة المزرعة الجديدة — مستقل بدون تضارب ═══ */
(function(){'use strict';
if(window.FARMSKIN)return;window.FARMSKIN=true;
if(!window.drawBG)return;
var T=window.T||48;
/* موضع وحجم صورة المزرعة فوق الرسم القديم */
var FX=49.7*T,FY=15.6*T,DW=12.6*T,DH=12.6*T*1.78;
/* مراكز الأصص داخل الصورة (نسب مئوية مضبوطة) */
var CX=[.24,.417,.592,.772],RY=[.158,.296,.431,.564,.70,.835];
/* مواءمة قطع المزرعة مع الأصص */
var OLD=window.plotPos;
window.plotPos=function(i){
if(i>=0&&i<24){var c=i%4,r=Math.floor(i/4);
return{x:FX+DW*CX[c],y:FY+DH*RY[r]};}
return OLD(i);};
var FIMG=null;
/* حذف الخلفية البيضاء/الظل باحتراف (غمر من الحواف فقط) */
function clean(im){var w=im.naturalWidth,h=im.naturalHeight;
var c=document.createElement('canvas');c.width=w;c.height=h;
var g=c.getContext('2d');g.drawImage(im,0,0);
var d=g.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),q=[],x,y;
function ok(i){if(p[i+3]<10)return true;var r=p[i],gg=p[i+1],b=p[i+2];var mn=Math.min(r,gg,b),mx=Math.max(r,gg,b);return (mx-mn)<20&&mn>125;}
function push(a,b){var id=b*w+a;if(seen[id])return;if(!ok(id*4))return;seen[id]=1;q.push(id);}
for(x=0;x<w;x++){push(x,0);push(x,h-1);}
for(y=0;y<h;y++){push(0,y);push(w-1,y);}
while(q.length){var id=q.pop();p[id*4+3]=0;var xx=id%w,yy=(id-xx)/w;
if(xx>0)push(xx-1,yy);if(xx<w-1)push(xx+1,yy);if(yy>0)push(xx,yy-1);if(yy<h-1)push(xx,yy+1);}
g.putImageData(d,0,0);return c;}
var im=new Image();
im.onload=function(){FIMG=clean(im);
if(window.ST&&window.drawBG)drawBG();
if(window.toast)toast('🌾 المزرعة الجديدة جاهزة!','gold');};
im.onerror=function(){if(window.toast)toast('⚠️ ارفع farm.png بجانب index.html','red');};
im.src='farm.png';
/* لف drawBG: عشب تحت + الصورة فوق القديم */
var _dbg=window.drawBG;
window.drawBG=function(){
_dbg();
if(!window.bgC)return;
var g=bgC.getContext('2d');
/* 1) مسح رسم المزرعة القديمة بالعشب (وتحتها يبقى عشب العالم) */
var ox=48.7*T,oy=15.2*T,ow=14.3*T,oh=23.4*T;
var gc=['#63a84e','#5da24a','#68ae52','#5b9d47','#6fb858'];
for(var gy=0;gy<oh;gy+=T)for(var gx=0;gx<ow;gx+=T){
g.fillStyle=gc[Math.floor(Math.random()*5)];
g.fillRect(ox+gx,oy+gy,Math.min(T,ow-gx),Math.min(T,oh-gy));}
g.strokeStyle='rgba(30,90,30,.4)';g.lineWidth=1.4;
for(var s=0;s<260;s++){var sx=ox+Math.random()*ow,sy=oy+Math.random()*oh;
g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.random()*3-1.5,sy-Math.random()*6);g.stroke();}
for(var f=0;f<26;f++){var fx=ox+Math.random()*ow,fy=oy+Math.random()*oh;
g.fillStyle=Math.random()<.5?'#fff':'#ffd43b';
g.beginPath();g.ellipse(fx,fy,2,2,0,0,7);g.fill();}
/* 2) ظل ناعم ثم صورة المزرعة فوق */
if(FIMG){
g.fillStyle='rgba(0,0,0,.25)';
g.beginPath();g.ellipse(FX+DW/2,FY+DH-4,DW*.55,14,0,0,7);g.fill();
g.drawImage(FIMG,FX,FY,DW,DH);}
};
console.log('FARM-SKIN ✓');
})();
</script>
